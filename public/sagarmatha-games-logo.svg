<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="mtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background (transparent, remove rect if not needed) -->
  <rect width="800" height="400" fill="none"/>

  <!-- Icon group: mountain + game controller notch -->
  <g transform="translate(400,145)">
    <!-- Main mountain peak (Sagarmatha) -->
    <path d="M -140 60 L -40 -95 L 0 -35 L 40 -95 L 140 60 Z" fill="url(#mtnGrad)"/>
    <!-- Snow caps -->
    <path d="M -40 -95 L -60 -55 L -18 -55 Z" fill="url(#snowGrad)"/>
    <path d="M 40 -95 L 20 -55 L 62 -55 Z" fill="url(#snowGrad)"/>
    <!-- Secondary smaller peak left -->
    <path d="M -140 60 L -95 -20 L -50 60 Z" fill="#2563EB" opacity="0.85"/>
    <!-- Secondary smaller peak right -->
    <path d="M 140 60 L 95 -20 L 50 60 Z" fill="#2563EB" opacity="0.85"/>

    <!-- Game controller D-pad accent, integrated at base of mountain -->
    <g transform="translate(0,60)">
      <rect x="-14" y="-4" width="28" height="8" rx="3" fill="url(#accentGrad)"/>
      <rect x="-4" y="-14" width="8" height="28" rx="3" fill="url(#accentGrad)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="400" y="290" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="52" letter-spacing="2" fill="#1E3A8A">SAGARMATHA</text>
  <text x="400" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="34" letter-spacing="6" fill="#2563EB">G A M E S</text>

  <!-- Thin divider line -->
  <line x1="260" y1="305" x2="540" y2="305" stroke="#93C5FD" stroke-width="2"/>
</svg>
